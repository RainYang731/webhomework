<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171329" />
    <meta name="description" content="點掉殭屍、讓月兔圖片快速落下補位，挑戰 60 秒最高分！" />
    <title>月兔防衛隊｜中秋夜遊戲</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-app">
      <header class="hud">
        <div class="brand"><span class="brand-mark">月</span><span class="brand-name">月兔防衛隊<small>MOON GUARD</small></span></div>
        <div class="hud-stat timer-stat"><span>剩餘時間</span><strong id="timer">60</strong></div>
        <div class="hud-stat score-stat"><span>本局分數</span><strong id="score">0</strong></div>
        <button class="rank-button" id="ranking-button" type="button" aria-label="開啟排行榜">榜單</button>
      </header>

      <div class="board-caption"><span><i></i> 月宮防線</span><span id="game-hint">點擊圖片消除，讓上方圖片落下補位</span></div>
      <section class="board" id="board" aria-label="4 欄 7 列遊戲區"></section>

      <footer class="game-footer">
        <label class="name-input"><span>隊員</span><input id="player-name" maxlength="12" autocomplete="nickname" placeholder="輸入名字" /></label>
        <div class="footer-note"><span class="footer-dot"></span><span id="footer-message">每點掉一張圖片得 1 分</span></div>
        <button class="start-button" id="start-button" type="button">開始遊戲 <b>↗</b></button>
      </footer>
    </main>

    <div class="overlay" id="ranking-modal" hidden>
      <button class="overlay-scrim" type="button" data-close="ranking" aria-label="關閉排行榜"></button>
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="ranking-title">
        <button class="close-button" type="button" data-close="ranking" aria-label="關閉">×</button>
        <p class="dialog-kicker">HALL OF FAME</p><h1 id="ranking-title">本機排行榜 <span>✦</span></h1>
        <p class="dialog-copy">分數保存在這台裝置的瀏覽器</p>
        <div class="leader-list" id="leader-list"></div>
        <div class="empty-board" id="empty-board"><span>✧</span><strong>還沒有紀錄</strong><small>來挑戰第一名吧！</small></div>
      </section>
    </div>

    <div class="overlay" id="result-modal" hidden>
      <button class="overlay-scrim" type="button" data-close="result" aria-label="關閉結果"></button>
      <section class="dialog result-dialog" role="dialog" aria-modal="true" aria-labelledby="result-title">
        <p class="dialog-kicker">MISSION COMPLETE</p><h1 id="result-title">遊戲結束！</h1>
        <p class="dialog-copy" id="result-caption">月宮暫時安全了</p>
        <div class="final-score"><strong id="final-score">0</strong><span>分</span></div>
        <p class="result-rank" id="result-rank"></p>
        <button class="start-button replay-button" id="again-button" type="button">再玩一次 <b>↗</b></button>
      </section>
    </div>
    <script src="game.js"></script>
  </body>
</html>
